name: CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nest-server
          path: |
            dist/
            package.json
            package-lock.json
            ecosystem.config.js

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nest-server
          path: ./deploy

      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          TARGET_DIR="/home/$EC2_USERNAME/nest-server"

          # .env 생성 후 배포 디렉토리에 포함
          echo "$ENV_FILE" > ./deploy/.env

          # 원격 디렉토리 준비
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "mkdir -p $TARGET_DIR"

          # 산출물 전송 (rsync가 없으면 scp -r 사용 가능)
          rsync -az -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            ./deploy/ $EC2_USERNAME@$EC2_HOST:$TARGET_DIR/

          # 원격에서 의존성 설치 + PM2 무중단 배포
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            set -e
            cd $TARGET_DIR
            npm ci --omit=dev
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
          "

          rm -f private_key.pem
